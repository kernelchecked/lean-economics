name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # Documentation generation (leanprover-community/docgen-action) was
      # removed 2026-11-20: the template's docgen step failed on every run
      # because this project has no doc-gen4 setup yet (its srcUri targets
      # failed for all dependencies and for the project itself), while the
      # Lean build above passed. Re-add a docs step when a doc-gen4 /
      # leanblueprint site is actually configured.
